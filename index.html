<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#131519">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Closing Line</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%88%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --ground:#131519; --surface:#1B1E24; --raised:#22262E; --line:#2C313B;
    --ink:#EDEAE2; --muted:#9BA1AC; --faint:#6B717C;
    --amber:#E9A94A; --amber-dim:rgba(233,169,74,.14);
    --win:#55B586; --loss:#E0605C; --push:#8A8F98;
    --win-dim:rgba(85,181,134,.14); --loss-dim:rgba(224,96,92,.14);
    --disp:"Barlow Condensed","Arial Narrow",sans-serif;
    --body:"Barlow","Helvetica Neue",Arial,sans-serif;
    --mono:"IBM Plex Mono","SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html{background:var(--ground)}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  #app{max-width:1080px;margin:0 auto;padding:28px 20px 64px;display:flex;flex-direction:column;gap:22px}

  /* ---------- header ---------- */
  .masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:16px}
  .eyebrow{font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);margin:0 0 2px}
  h1{font-family:var(--disp);font-weight:700;font-size:44px;line-height:.95;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
  .plan-strip{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
  .plan-strip b{color:var(--ink);font-weight:500}
  .save-note{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .save-note.warn{color:var(--amber)}

  /* ---------- stat tiles ---------- */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px 12px;display:flex;flex-direction:column;gap:2px}
  .tile .label{font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .tile .big{font-family:var(--disp);font-weight:700;font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums}
  .tile .sub{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .pos{color:var(--win)} .neg{color:var(--loss)}
  .meter{height:6px;border-radius:3px;background:var(--raised);margin-top:8px;overflow:hidden}
  .meter>i{display:block;height:100%;background:var(--amber);border-radius:3px}
  .meter>i.low{background:var(--loss)}

  /* ---------- panels ---------- */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
  .panel h2{font-family:var(--disp);font-weight:600;font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);margin:0 0 12px;display:flex;align-items:baseline;gap:10px}
  .panel h2 small{font-family:var(--mono);font-size:11px;letter-spacing:0;text-transform:none;color:var(--faint);font-weight:400}

  /* ---------- chart ---------- */
  .chartwrap{position:relative}
  .chartwrap svg{display:block;width:100%;height:auto}
  .tip{position:absolute;pointer-events:none;background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-family:var(--mono);font-size:11.5px;line-height:1.5;color:var(--ink);white-space:nowrap;transform:translate(-50%,-110%);display:none;box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:2}
  .tip .t-date{color:var(--muted)}
  .empty-chart{padding:34px 10px;text-align:center;color:var(--faint);font-size:14px}

  /* ---------- two-col ---------- */
  .cols{display:grid;grid-template-columns:1.2fr .8fr;gap:22px;align-items:start}
  @media(max-width:760px){.cols{grid-template-columns:1fr}}

  /* ---------- form ---------- */
  form.addbet{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field.wide{grid-column:1/-1}
  .field label{font-family:var(--disp);font-weight:600;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  input,select{background:var(--ground);border:1px solid var(--line);border-radius:6px;color:var(--ink);font-family:var(--mono);font-size:14px;padding:9px 10px;width:100%}
  input:focus,select:focus,button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
  select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat}
  .stakerow{display:flex;gap:6px;align-items:center}
  .stakerow input{flex:1}
  .ub{background:var(--raised);border:1px solid var(--line);border-radius:6px;color:var(--muted);font-family:var(--mono);font-size:12px;padding:9px 8px;cursor:pointer}
  .ub:hover{color:var(--ink);border-color:var(--faint)}
  .formfoot{grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:2px}
  .bucket-chip{font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;border-radius:4px;padding:3px 9px}
  .bucket-core{background:var(--amber-dim);color:var(--amber)}
  .bucket-fun{background:rgba(138,143,152,.16);color:var(--muted)}
  .towin{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .warnmsg{grid-column:1/-1;font-family:var(--mono);font-size:12px;color:var(--amber);background:var(--amber-dim);border-radius:6px;padding:8px 10px}
  .submit{margin-left:auto;background:var(--amber);border:none;border-radius:6px;color:#1A1408;font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;padding:10px 22px;cursor:pointer}
  .submit:hover{filter:brightness(1.08)}

  /* ---------- rules card ---------- */
  .rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
  .rules li{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink)}
  .rules li:last-child{border-bottom:none}
  .rules .rn{font-family:var(--mono);font-size:12px;color:var(--amber);min-width:16px;padding-top:2px}
  .rules b{font-weight:600}
  .rules span.why{color:var(--muted)}

  /* ---------- picks card ---------- */
  .pickrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .pickrow:last-child{border-bottom:none}
  .kbadge{font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;border-radius:4px;padding:3px 8px;flex:none}
  .kbadge.fade{background:var(--amber-dim);color:var(--amber)}
  .kbadge.sharp{background:rgba(85,181,134,.14);color:var(--win)}
  .kbadge.rlm{background:rgba(224,96,92,.14);color:var(--loss)}
  .kbadge.wcoast{background:rgba(127,168,217,.15);color:#7FA8D9}
  .kbadge.roaddog{background:rgba(180,142,224,.16);color:#B48EE0}
  .kbadge.homedog{background:rgba(91,200,203,.16);color:#5BC8CB}
  .kbadge.injury{background:rgba(224,96,92,.18);color:var(--loss)}
  .kbadge.steam{background:rgba(85,181,134,.16);color:var(--win)}
  .kbadge.latepub{background:var(--amber-dim);color:var(--amber)}
  .kbadge.stack{background:linear-gradient(90deg,var(--amber-dim),rgba(127,168,217,.2));color:var(--amber);border:1px solid var(--amber)}
  .pickrow.stacked{border-left:3px solid var(--amber);background:linear-gradient(90deg,var(--amber-dim),rgba(127,168,217,.08) 70%);padding-left:12px;border-radius:6px;margin:2px 0}
  .pmain{flex:1;min-width:200px}
  .pmain b{font-weight:600}
  .psig{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
  .pstat{font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:3px 8px;flex:none}
  .pstat.play{background:var(--amber);color:#1A1408;border-color:var(--amber)}
  .pstat.alert{background:var(--loss-dim);color:var(--loss);border-color:var(--loss)}
  .plog{border:1px solid var(--line);background:var(--raised);border-radius:6px;color:var(--ink);font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;cursor:pointer;flex:none}
  .plog:hover{border-color:var(--amber);color:var(--amber)}
  .cardnote{font-size:13px;color:var(--muted);margin:0 0 10px}
  .pickrow.hot{border-left:3px solid var(--amber);background:linear-gradient(90deg,var(--amber-dim),transparent 60%);padding-left:12px;border-radius:6px;margin:2px 0}
  .legend{font-family:var(--mono);font-size:11px;color:var(--faint);margin:0 0 12px;line-height:1.7}
  .legend b{color:var(--muted);font-weight:500}
  .sysrec{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--raised);border-radius:6px;padding:8px 12px;margin:0 0 14px;font-variant-numeric:tabular-nums}
  .tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);position:sticky;top:0;background:var(--ground);z-index:5}
  .tab{background:none;border:none;color:var(--muted);font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;padding:12px 16px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px}
  .tab.on{color:var(--amber);border-bottom-color:var(--amber)}
  .subtabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;-webkit-overflow-scrolling:touch;position:sticky;top:47px;background:var(--ground);z-index:4}
  .dayrec{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;padding:8px 2px 0;font-variant-numeric:tabular-nums}
  .dayrec b{color:var(--ink);font-weight:600}
  .updated{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:2px}
  .resbtn{display:block;width:100%;text-align:left;background:none;border:none;border-top:1px dashed var(--line);color:var(--faint);font-family:var(--mono);font-size:11.5px;padding:8px 0 2px;cursor:pointer;margin-top:6px}
  .resbtn:hover{color:var(--muted)}
  .kbadge.nhl{background:rgba(127,168,217,.15);color:#7FA8D9}
  .kbadge.ufc{background:rgba(224,96,92,.15);color:#E0605C}
  /* second-source confirmation chip (Action Network vs VSiN) — VSiN decides the play, this grades confidence */
  .cchip{font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;border-radius:4px;padding:2px 7px;flex:none;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .cchip.confirmed{background:var(--win-dim);color:var(--win);border-color:rgba(85,181,134,.4)}
  .cchip.caution{background:var(--amber-dim);color:var(--amber);border-color:rgba(233,169,74,.5)}
  .cchip.unconfirmed{color:var(--faint)}
  /* hourly code re-confirmation of live picks */
  .cchip.lcok{background:var(--win-dim);color:var(--win);border-color:rgba(85,181,134,.4)}
  .cchip.lcwarn{background:var(--amber-dim);color:var(--amber);border-color:rgba(233,169,74,.5);font-weight:700}
  h3.subhead.warn{color:var(--amber);border-top:1px dashed rgba(233,169,74,.5);padding-top:8px;margin-top:10px}
  h3.subhead.bad{color:#e05252;border-top:1px dashed rgba(224,82,82,.6);padding-top:8px;margin-top:10px}
  .cchip.lcbad{background:rgba(224,82,82,.14);color:#e05252;border-color:rgba(224,82,82,.5);font-weight:600}
  .cchip.contention{background:rgba(120,90,220,.16);color:#b8a6ea;border-color:rgba(120,90,220,.55)}
  .chips{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
  .nobet{font-family:var(--disp);font-weight:800;font-size:13px;letter-spacing:.08em;background:#e05252;color:#fff;border-radius:6px;padding:6px 12px;flex:none;white-space:nowrap;box-shadow:0 0 0 2px rgba(224,82,82,.35)}
  .nobet.done{background:rgba(224,82,82,.16);color:#e05252;border:1px solid #e05252;font-size:11px;box-shadow:none}
  /* 98/2 read — posted at its tier, with an asterisk */
  .kbadge.flag98{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(233,169,74,.5)}
  .kbadge.ps{background:rgba(255,140,0,.18);color:#ff9a2e;border:1px solid rgba(255,140,0,.65)}
  .kbadge.yoyo{background:rgba(160,90,255,.2);color:#cdb0ff;border:1px solid rgba(160,90,255,.7)}
.kbadge.codepick{background:#0f3d2e;color:#7ee2b8;border:1px solid #1f6b4f}
.kbadge.ainote{background:#2a2a2a;color:#9a9a9a;border:1px solid #444}
  sup.ast{color:var(--amber);font-weight:700;font-size:.8em;margin-left:1px}
  h3.subhead{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
  /* game start time on a pick row */
  .gtime{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;margin-left:4px}
  .gtime.started{color:var(--amber)}
  /* plays ledger */
  .ledger{display:flex;flex-direction:column;gap:4px}
  .ledrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px}
  .ledrow .ldate{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
  .ledrow .lflag{font-family:var(--mono);font-size:10.5px;color:var(--amber);margin-left:4px}
  .ledrow .lres{font-family:var(--mono);font-weight:700;width:22px;height:22px;line-height:22px;text-align:center;border-radius:5px;background:var(--low-soft,rgba(255,255,255,.06));color:var(--muted)}
  .ledrow .lres.win{background:var(--win-dim);color:var(--win)} .ledrow .lres.loss{background:rgba(224,82,82,.14);color:#e05252}
  /* record by tab (Record tab) */
  .tabrecs{display:flex;flex-direction:column;gap:6px}
  .tabrec{display:grid;grid-template-columns:1.25fr 1.4fr 1.3fr auto;gap:8px 10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px}
  .tabrec .tname{font-weight:600}
  .tabrec .trec b{font-variant-numeric:tabular-nums}
  .tabrec .tstreak{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tabrec .tstreak small{font-weight:400;color:var(--muted);font-family:inherit}
  .tabrec .tdots{display:flex;gap:3px;justify-self:end}
  .tabrec .tdots .dot{width:16px;height:16px;font-size:9.5px;line-height:16px}
  .tabrec .faint{color:var(--faint)}
  @media(max-width:520px){.tabrec{grid-template-columns:1fr 1fr;} .tabrec .tdots{grid-column:1/-1;justify-self:start}}
  .stab{flex:none;background:var(--raised);border:1px solid var(--line);border-radius:16px;color:var(--muted);font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:6px 14px;cursor:pointer;white-space:nowrap}
  .stab.on{background:var(--amber);border-color:var(--amber);color:#1A1408}
  .dots{display:flex;gap:4px;flex-wrap:wrap}
  .dot{width:22px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:11px}
  .dot.dw{background:var(--win-dim);color:var(--win)}
  .dot.dl{background:var(--loss-dim);color:var(--loss)}
  .sysrec b{color:var(--ink);font-weight:500}
  .ltdelta{font-weight:600}
  tr[data-action="lthist"]{cursor:pointer}
  tr[data-action="lthist"]:hover td{background:rgba(233,169,74,.05)}
  .histcell{background:var(--ground);padding:0 !important}
  .histcell table{min-width:0;margin:6px 0}
  .histcell th,.histcell td{font-size:11.5px;padding:4px 10px;border-bottom:1px solid var(--raised)}
  .histhint{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
  .sporttag{font-family:var(--disp);font-weight:600;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line);border-radius:3px;padding:1px 5px;margin-right:6px}
  .ltsport{font-family:var(--disp) !important;font-weight:700 !important;font-size:13px !important;letter-spacing:.14em;text-transform:uppercase;color:var(--amber) !important;padding:16px 10px 6px !important}

  /* ---------- pending cards ---------- */
  .pending-list{display:flex;flex-direction:column;gap:8px}
  .pcard{background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .pcard .pdesc{flex:1;min-width:180px}
  .pcard .pdesc b{font-weight:600}
  .pcard .pmeta{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .pcard .pmoney{font-family:var(--mono);font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
  .pcard .pmoney small{display:block;color:var(--faint);font-size:11px}
  .settle{display:flex;gap:5px}
  .sb{border:1px solid var(--line);background:var(--surface);border-radius:6px;font-family:var(--disp);font-weight:700;font-size:13px;width:34px;height:32px;cursor:pointer;color:var(--muted)}
  .sb.w:hover{background:var(--win-dim);color:var(--win);border-color:var(--win)}
  .sb.l:hover{background:var(--loss-dim);color:var(--loss);border-color:var(--loss)}
  .sb.p:hover{color:var(--ink);border-color:var(--faint)}
  .sb.x{width:30px;color:var(--faint)}
  .sb.x:hover{color:var(--loss);border-color:var(--loss)}
  .sb.confirm{background:var(--loss);color:#fff;border-color:var(--loss);width:auto;padding:0 10px}
  .none-msg{color:var(--faint);font-size:14px;padding:6px 0}

  /* ---------- settled table ---------- */
  .tscroll{overflow-x:auto}
  table{border-collapse:collapse;width:100%;min-width:640px}
  th{font-family:var(--disp);font-weight:600;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
  td{padding:8px 10px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
  td.mono{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
  td.num{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right}
  th.num{text-align:right}
  .pill{display:inline-block;font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.06em;border-radius:4px;padding:2px 8px;min-width:26px;text-align:center}
  .pill.win{background:var(--win-dim);color:var(--win)}
  .pill.loss{background:var(--loss-dim);color:var(--loss)}
  .pill.push{background:rgba(138,143,152,.16);color:var(--push)}
  tr.rowdel td{opacity:.55}
  .tdel{background:none;border:none;color:var(--faint);cursor:pointer;font-size:14px;padding:2px 6px}
  .tdel:hover{color:var(--loss)}
  .tdel.confirm{color:#fff;background:var(--loss);border-radius:4px;font-size:11px;font-family:var(--mono)}

  /* ---------- breakdown ---------- */
  .bk-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  @media(max-width:760px){.bk-grid{grid-template-columns:1fr}}
  .bk table{min-width:0}
  .bucketbars{display:flex;flex-direction:column;gap:14px}
  .bbar .bhead{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:5px;font-variant-numeric:tabular-nums}
  .bbar .bhead b{color:var(--ink);font-weight:500}

  footer{color:var(--faint);font-family:var(--mono);font-size:11px;text-align:center;border-top:1px solid var(--line);padding-top:16px}
  @media(max-width:560px){
    h1{font-size:36px}
    form.addbet{grid-template-columns:1fr}
    .tile .big{font-size:28px}
  }
</style>
</head>
<body>

<script>
(function(){

var API="/api/state", LSKEY="closing-line-v1", KEYKEY="closing-line-key";
var DEFAULT_STATE={rev:0,config:{season:"2026",start:3000,unit:45,coreBudget:2400,funBudget:600},bets:[]};
var state=DEFAULT_STATE;
var picksData=null, linesData=null, journalData=null, sentimentData=null, expandedGame=null, activeTab='card', cardSub='plays';
var resultsOpen={}, lastDataAt=0, extData=null; /* extData = session-ingested Action Network / DonBest splits (/api/ingest) */
var BET_TRACKING=false; /* shelved per Carl 2026-09-01 — Bankroll tab & Log-it hidden, all code and data kept */
var saveMode="…", syncOK=false;
var FUN_TYPES=["Parlay","Same-Game Parlay"];
var TYPES=["Spread","Total","Moneyline","Prop","Future / Win Total","Teaser","Parlay","Same-Game Parlay"];
var BOOKS=["Circa","Westgate SuperBook","BetMGM NV","Caesars NV","South Point","STN","Underdog","PrizePicks","Other"];
var pendingDelete=null;

/* ---------- access key ---------- */
function appKey(){
  var m=location.hash.match(/k=([^&]+)/);
  if(m){try{localStorage.setItem(KEYKEY,m[1])}catch(_){} return m[1]}
  try{return localStorage.getItem(KEYKEY)||""}catch(_){return ""}
}

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function money(n,sign){
  var neg=n<0, v=Math.abs(n);
  var s="$"+v.toLocaleString("en-US",{minimumFractionDigits:(v%1?2:0),maximumFractionDigits:2});
  if(neg)return "−"+s;
  return (sign&&n>0?"+":"")+s;
}
function units(n){var u=n/state.config.unit;return (u>0?"+":u<0?"−":"")+Math.abs(u).toFixed(1)+"u"}
function fmtOdds(o){return o>0?"+"+o:String(o)}
function profitOf(b){return b.odds>0 ? b.stake*b.odds/100 : b.stake*100/Math.abs(b.odds)}
function plOf(b){
  if(b.result==="win")return profitOf(b);
  if(b.result==="loss")return -b.stake;
  return 0;
}
function bucketOf(t){return FUN_TYPES.indexOf(t)>=0?"fun":"core"}
function fdate(d){
  var p=d.split("-"); var M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return M[+p[1]-1]+" "+(+p[2]);
}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function cls(n){return n>0?"pos":n<0?"neg":""}

/* ---------- stats ---------- */
function computeStats(){
  var c=state.config, s={w:0,l:0,p:0,settledPL:0,settledStake:0,atRisk:0,funPL:0,funPending:0,corePL:0,corePending:0,byType:{}};
  state.bets.forEach(function(b){
    var bk=bucketOf(b.type);
    if(b.result==="pending"){
      s.atRisk+=b.stake;
      if(bk==="fun")s.funPending+=b.stake; else s.corePending+=b.stake;
      return;
    }
    var pl=plOf(b);
    s.settledPL+=pl; s.settledStake+=b.stake;
    if(b.result==="win")s.w++; else if(b.result==="loss")s.l++; else s.p++;
    if(bk==="fun")s.funPL+=pl; else s.corePL+=pl;
    var t=s.byType[b.type]||(s.byType[b.type]={w:0,l:0,p:0,pl:0});
    t.pl+=pl; if(b.result==="win")t.w++;else if(b.result==="loss")t.l++;else t.p++;
  });
  s.bankroll=c.start+s.settledPL;
  s.roi=s.settledStake>0?s.settledPL/s.settledStake:0;
  s.winPct=(s.w+s.l)>0?s.w/(s.w+s.l):null;
  s.funRemaining=c.funBudget+s.funPL-s.funPending;
  s.coreRemaining=c.coreBudget+s.corePL-s.corePending;
  return s;
}
function settledSorted(){
  return state.bets.filter(function(b){return b.result!=="pending"})
    .slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.createdAt-b.createdAt)});
}

/* ---------- chart ---------- */
var chartPts=[];
function chartHTML(){
  var settled=settledSorted();
  if(settled.length<1){
    return '<div class="empty-chart">Your bankroll curve starts after your first settled bet.<br>Season opens at '+money(state.config.start)+'.</div>';
  }
  var W=800,H=250,padL=56,padR=16,padT=14,padB=26;
  var pts=[{x:0,label:"Start",date:"",bank:state.config.start,pl:0}];
  var run=state.config.start;
  settled.forEach(function(b,i){
    run+=plOf(b);
    pts.push({x:i+1,label:b.desc,date:b.date,bank:run,pl:plOf(b)});
  });
  var n=pts.length;
  var lo=Math.min.apply(null,pts.map(function(p){return p.bank})),
      hi=Math.max.apply(null,pts.map(function(p){return p.bank}));
  var span=Math.max(hi-lo, state.config.unit*4); var mid=(hi+lo)/2;
  lo=mid-span/2-span*0.12; hi=mid+span/2+span*0.12;
  function X(i){return padL+(n===1?0:(i/(n-1))*(W-padL-padR))}
  function Y(v){return padT+(1-(v-lo)/(hi-lo))*(H-padT-padB)}
  chartPts=pts.map(function(p,i){return{px:X(i),py:Y(p.bank),d:p}});
  var line=chartPts.map(function(p,i){return (i?"L":"M")+p.px.toFixed(1)+" "+p.py.toFixed(1)}).join(" ");
  var area=line+" L"+chartPts[chartPts.length-1].px.toFixed(1)+" "+(H-padB)+" L"+chartPts[0].px.toFixed(1)+" "+(H-padB)+" Z";
  var g="";
  for(var gi=0;gi<4;gi++){
    var gv=lo+(hi-lo)*(gi+0.5)/4, gy=Y(gv);
    g+='<line x1="'+padL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+gy.toFixed(1)+'" stroke="#2C313B" stroke-width="1"/>'
      +'<text x="'+(padL-8)+'" y="'+(gy+3.5).toFixed(1)+'" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="10.5" fill="#6B717C">$'+Math.round(gv).toLocaleString()+'</text>';
  }
  var base=Y(state.config.start);
  var baseline='<line x1="'+padL+'" y1="'+base.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+base.toFixed(1)+'" stroke="#6B717C" stroke-width="1" stroke-dasharray="3 4"/>';
  var xlabels="";
  [0,n-1].concat(n>4?[Math.floor((n-1)/2)]:[]).forEach(function(i){
    if(!pts[i].date&&i!==0)return;
    var t=i===0?"Start":fdate(pts[i].date);
    xlabels+='<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="10.5" fill="#6B717C">'+t+'</text>';
  });
  var last=chartPts[chartPts.length-1];
  var endCol=last.d.bank>=state.config.start?"#55B586":"#E0605C";
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Bankroll over the season">'
    +g+baseline
    +'<path d="'+area+'" fill="rgba(233,169,74,.09)"/>'
    +'<path d="'+line+'" fill="none" stroke="#E9A94A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
    +'<circle id="hoverdot" r="4" fill="#E9A94A" stroke="#131519" stroke-width="2" style="display:none"/>'
    +'<circle cx="'+last.px.toFixed(1)+'" cy="'+last.py.toFixed(1)+'" r="4.5" fill="'+endCol+'" stroke="#131519" stroke-width="2"/>'
    +'<text x="'+Math.min(last.px,W-padR-4).toFixed(1)+'" y="'+(last.py-10).toFixed(1)+'" text-anchor="end" font-family="Barlow Condensed,sans-serif" font-weight="700" font-size="15" fill="#EDEAE2">'+money(last.d.bank)+'</text>'
    +xlabels+'</svg><div class="tip" id="tip"></div>';
}
function wireChart(){
  var wrap=document.getElementById("chartwrap"); if(!wrap)return;
  var svg=wrap.querySelector("svg"); if(!svg||!chartPts.length)return;
  var tip=document.getElementById("tip"), dot=document.getElementById("hoverdot");
  function onmove(ev){
    var r=svg.getBoundingClientRect();
    var mx=(ev.clientX-r.left)/r.width*800;
    var best=chartPts[0],bd=1e9;
    chartPts.forEach(function(p){var d=Math.abs(p.px-mx);if(d<bd){bd=d;best=p}});
    dot.style.display="";dot.setAttribute("cx",best.px);dot.setAttribute("cy",best.py);
    tip.style.display="block";
    tip.style.left=(best.px/800*r.width)+"px";
    tip.style.top=(best.py/250*r.height)+"px";
    tip.innerHTML=(best.d.date?'<span class="t-date">'+fdate(best.d.date)+'</span> · ':'')
      +esc(best.d.label)+(best.d.date?'<br><span class="'+cls(best.d.pl)+'">'+money(best.d.pl,true)+'</span> · ':'<br>')
      +'bank <b>'+money(best.d.bank)+'</b>';
  }
  function onleave(){tip.style.display="none";dot.style.display="none"}
  svg.addEventListener("mousemove",onmove);
  svg.addEventListener("mouseleave",onleave);
  svg.addEventListener("touchstart",function(e){if(e.touches[0])onmove(e.touches[0])},{passive:true});
}

var MULTIWORD_NICKS=["Trail Blazers","White Sox","Red Sox","Blue Jays","Maple Leafs","Blue Jackets","Golden Knights","Red Wings","Hockey Club"];
function teamShort(name){
  name=String(name);
  var ab=TEAM_ABBR[name];
  if(!ab)return name; /* colleges etc. keep the board name */
  var nick=name.split(" ").pop();
  for(var i=0;i<MULTIWORD_NICKS.length;i++){
    if(name.indexOf(MULTIWORD_NICKS[i])>=0){nick=MULTIWORD_NICKS[i];break}
  }
  return ab+" "+nick;
}

/* ---------- game date parsing & sorting ---------- */
var MONTHS={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function ptISO(ms){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles'}).format(new Date(ms==null?Date.now():ms))}
function ptTime(ms){return new Date(ms).toLocaleTimeString('en-US',{timeZone:'America/Los_Angeles',hour:'numeric',minute:'2-digit'}).toLowerCase().replace(' ','')}
/* date-only parse of the game string (ISO or "Mon D"), no time */
function gameISO(p){
  var g=String(p.game||''), now=new Date();
  var iso=g.match(/(\d{4})-(\d{2})-(\d{2})/); if(iso)return iso[1]+'-'+iso[2]+'-'+iso[3];
  var m=g.match(/(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{1,2})/i); if(!m)return null;
  var d=new Date(now.getFullYear(),MONTHS[m[1].slice(0,3).toLowerCase()],+m[2],12,0,0);
  if(d.getTime()<now.getTime()-180*86400000)d.setFullYear(d.getFullYear()+1); else if(d.getTime()>now.getTime()+180*86400000)d.setFullYear(d.getFullYear()-1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
/* kickoff / first pitch (ISO) for a pick: the pick's own start field (code pipeline stamps it), else the
   Action Network row for the same game (league + date + both nicknames, either orientation) */
function startOf(p){
  if(p.start)return p.start;
  if(!extData||!extData.rows)return null;
  var gm=String(p.game||'').match(/^(.*?)\s+@\s+(.*?)\s+[—-]/); if(!gm)return null;
  var sp=(String(p.game||'').match(/\((NFL|WNBA|NBA|CFB|CBB|MLB|NHL)\)/i)||[])[1]; sp=sp?sp.toUpperCase():p._sport;
  var date=gameISO(p); if(!date||!sp)return null;
  var want=[lastWordKey(gm[1]),lastWordKey(gm[2])].sort().join('~'), k, hit=null;
  for(k in extData.rows){var r=extData.rows[k];
    if(r.league===sp&&r.date===date&&r.start&&[lastWordKey(r.away),lastWordKey(r.home)].sort().join('~')===want){ if(hit&&hit!==r.start)return null; hit=r.start; }}
  return hit;
}
function gameDate(p){
  var st=startOf(p);
  if(st){var sd=new Date(st); if(!isNaN(sd.getTime())){sd._hasTime=true;return sd}}
  var g=String(p.game||''), now=new Date(), d=null;
  var iso=g.match(/(\d{4})-(\d{2})-(\d{2})/); /* code-pipeline format */
  if(iso){d=new Date(+iso[1],+iso[2]-1,+iso[3],12,0,0)}
  else{
    var m=g.match(/(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{1,2})/i);
    if(!m)return null;
    d=new Date(now.getFullYear(),MONTHS[m[1].slice(0,3).toLowerCase()],+m[2],12,0,0);
    if(d.getTime()<now.getTime()-180*86400000)d.setFullYear(d.getFullYear()+1);   /* January games seen in December */
    else if(d.getTime()>now.getTime()+180*86400000)d.setFullYear(d.getFullYear()-1); /* December games seen in January */
  }
  /* kickoff time, if the game/signal text carries one — but NOT the clock stamps inside confirmation tags
     ("last 12:45pm", "on the 12:45pm read", "at 12:45pm"), which are read times, not kickoff times */
  var sig=String(p.signal||'').replace(/\b(last|the|at)\s+\d{1,2}:\d{2}\s*(am|pm)\b/gi,'');
  var t=String(sig+' '+(p.game||'')).match(/(\d{1,2}):(\d{2})\s*(am|pm)/i);
  if(t){d.setHours((+t[1]%12)+(/pm/i.test(t[3])?12:0),+t[2],0,0);d._hasTime=true}
  return d;
}
function sortByGame(arr){
  return arr.slice().sort(function(a,b){
    var da=gameDate(a),db=gameDate(b);
    if(!da&&!db)return 0; if(!da)return 1; if(!db)return -1;
    return da-db;
  });
}

/* ---------- line tracker ---------- */
function lineTrackerHTML(){
  if(!linesData||!linesData.snapshots||!linesData.snapshots.length){
    return '<p class="none-msg">Line history loads here once snapshots accumulate.</p>';
  }
  var SPORT_NAMES={nfl:"NFL",wnba:"WNBA",nba:"NBA",cfb:"CFB",cbb:"CBB",mlb:"MLB",nhl:"NHL"};
  var bySport={};
  linesData.snapshots.forEach(function(s){
    var sp=s.sport||"nfl";
    (bySport[sp]=bySport[sp]||[]).push(s);
  });
  var rows='';
  /* fixed order: NFL, CFB, then the rest, WNBA last */
  var ordered=['nfl','cfb','nba','cbb','nhl','mlb'].filter(function(s){return bySport[s]})
    .concat(Object.keys(bySport).filter(function(s){return ['nfl','cfb','nba','cbb','nhl','mlb','wnba'].indexOf(s)<0}))
    .concat(bySport.wnba?['wnba']:[]);
  ordered.forEach(function(sp){
    rows+='<tr><td colspan="6" class="ltsport">'+esc(SPORT_NAMES[sp]||sp.toUpperCase())+'</td></tr>';
    var snaps=bySport[sp].slice().sort(function(a,b){return a.ts<b.ts?-1:1});
    var latest=snaps[snaps.length-1];
    var isML=(sp==='mlb'||sp==='nhl'); /* baseball & hockey: the moneyline is the market, run/puck line pinned at ±1.5 */
    (latest.games||[]).forEach(function(g){
      if(g.spread_home==null&&g.ml_home==null)return;
      var lineKey=isML?'ml_home':'spread_home';
      var open=null;
      for(var i=0;i<snaps.length;i++){
        var m=(snaps[i].games||[]).find(function(x){return x.away===g.away&&x.home===g.home&&x[lineKey]!=null});
        if(m){open=m;break}
      }
      if(!open)open=g;
      function fmtLine(v){return v==null?'—':((v>0?'+':'')+v)}
      var d=(g[lineKey]!=null&&open[lineKey]!=null)?g[lineKey]-open[lineKey]:0;
      var dTxt=d===0?'—':((d>0?'+':'')+(Math.round(d*10)/10))+(isML?'¢':'');
      var bigMove=isML?Math.abs(d)>=20:Math.abs(d)>=1;
      var dCls=d===0?'':bigMove?(' '+(d<0?'pos':'neg')):'';
      var tOpen=open.spread_bets&&open.spread_bets.home!=null?open.spread_bets.home+'%':'—';
      var tNow=g.spread_bets&&g.spread_bets.home!=null?g.spread_bets.home+'%':'—';
      var hNow=g.spread_handle&&g.spread_handle.home!=null?g.spread_handle.home+'%':'—';
      var key=sp+'|'+g.away+'|'+g.home;
      rows+='<tr data-action="lthist" data-key="'+esc(key)+'" title="Tap for full history"><td>'+esc(teamShort(g.away))+' @ <b>'+esc(teamShort(g.home))+'</b> <span style="color:var(--faint)">'+esc(g.date||'')+'</span></td>'
        +'<td class="num">'+fmtLine(open[lineKey])+' → <b>'+fmtLine(g[lineKey])+'</b></td>'
        +'<td class="num ltdelta'+dCls+'">'+dTxt+'</td>'
        +'<td class="num">'+tOpen+' → '+tNow+'</td>'
        +'<td class="num">'+hNow+'</td>'
        +'<td class="num">'+(g.total!=null?g.total:'—')+'</td></tr>';
      if(expandedGame===key){
        var hist='';
        snaps.forEach(function(s){
          var m=(s.games||[]).find(function(x){return x.away===g.away&&x.home===g.home});
          if(!m)return;
          var dt=new Date(s.ts);
          var when=isNaN(dt)?s.ts:(dt.getMonth()+1)+'/'+dt.getDate()+' '+(((dt.getHours()%12)||12))+(dt.getHours()<12?'am':'pm');
          hist+='<tr><td class="mono">'+esc(when)+'</td>'
            +'<td class="num">'+fmtLine(m[lineKey])+'</td>'
            +'<td class="num">'+(m.spread_bets&&m.spread_bets.home!=null?m.spread_bets.home+'%':'—')+'</td>'
            +'<td class="num">'+(m.spread_handle&&m.spread_handle.home!=null?m.spread_handle.home+'%':'—')+'</td>'
            +'<td class="num">'+(m.total!=null?m.total:'—')+'</td>'
            +'<td class="num">'+(m.total_bets&&m.total_bets.over!=null?m.total_bets.over+'%':'—')+'</td>'
            +'<td class="num">'+(m.total_handle&&m.total_handle.over!=null?m.total_handle.over+'%':'—')+'</td></tr>';
        });
        rows+='<tr><td colspan="6" class="histcell"><table><thead><tr><th>Captured</th><th class="num">'+(isML?'Moneyline':'Spread')+'</th><th class="num">Tix (home)</th><th class="num">$ (home)</th><th class="num">Total</th><th class="num">Tix (over)</th><th class="num">$ (over)</th></tr></thead><tbody>'+hist+'</tbody></table><span class="histhint">every snapshot we hold for this game · home-team numbers · tap the game row to close</span></td></tr>';
      }
    });
  });
  if(!rows)return '<p class="none-msg">No upcoming games in the tracker yet.</p>';
  return '<div class="tscroll"><table><thead><tr><th>Game <span class="histhint">tap a row for full history · MLB shows moneyline</span></th><th class="num">Line (home)</th><th class="num">Move</th><th class="num">Tickets (home)</th><th class="num">Money now</th><th class="num">Total</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

/* ---------- shadow ledger ---------- */
function ledgerHTML(){
  var trends=(journalData&&journalData.trends)||{};
  /* The grader is an LLM writing JSON, so normalize whatever shape it used into
     a flat list of {sport, angle, w, l}. Handles {sport:{angle:{w,l}}},
     {angle:{sport,n,*_win,pct}}, and {angle:{sport:{w,l}}}. */
  function toWL(o){
    if(!o||typeof o!=='object')return null;
    if(typeof o.w==='number'&&typeof o.l==='number')return {w:o.w,l:o.l};
    var n=typeof o.n==='number'?o.n:null;
    if(n!=null){
      var winKey=Object.keys(o).find(function(k){return /(^|_)(win|hit|cover)/.test(k)&&typeof o[k]==='number'});
      if(winKey)return {w:o[winKey],l:Math.max(0,n-o[winKey]-(o.push||0))};
      if(typeof o.pct==='number'){var w=Math.round(o.pct*(o.pct<=1?n:n/100));return {w:w,l:Math.max(0,n-w)}}
      if(typeof o.over==='number'&&typeof o.under==='number')return {w:o.over,l:o.under};
    }
    return null;
  }
  var flat=[];
  Object.keys(trends).forEach(function(k1){
    var v1=trends[k1];
    var direct=toWL(v1);
    if(direct){ flat.push({sport:(v1&&v1.sport)||'',angle:k1,w:direct.w,l:direct.l}); return; }
    if(v1&&typeof v1==='object'){
      Object.keys(v1).forEach(function(k2){
        var wl=toWL(v1[k2]);
        if(wl)flat.push({sport:k1.length<=5?k1:((v1[k2]&&v1[k2].sport)||''),angle:k2,w:wl.w,l:wl.l});
      });
    }
  });
  var h='';
  /* headline: the core thesis — how the public's own side is performing */
  var pub=flat.filter(function(t){return /tickets.*(major|public)|public/i.test(t.angle)});
  if(pub.length){
    var pw=0,pl=0; pub.forEach(function(t){pw+=t.w;pl+=t.l});
    var pn=pw+pl;
    if(pn){
      var fadeW=pl, fadeL=pw, fpct=fadeW/pn*100; /* fading = the inverse of the public's record */
      h+='<div class="sysrec" style="border-left:3px solid var(--amber)"><b>Fade the public (core thesis):</b> the public\u2019s own side is '+pw+'\u2013'+pl+' ('+(pw/pn*100).toFixed(0)+'%) \u2014 so <b>betting against them would be '+fadeW+'\u2013'+fadeL+' ('+fpct.toFixed(0)+'%)</b> across '+pn+' graded games'+(pn<20?' \u00b7 needs n\u226520 to call':'')+'.</div>';
    }
  }
  var SPORTS=['nfl','cfb','nba','cbb','wnba','mlb','nhl'];
  var seen={}; flat.forEach(function(t){if(t.sport)seen[String(t.sport).toLowerCase()]=1});
  var missing=SPORTS.filter(function(sp){return !seen[sp]});
  if(missing.length){
    h+='<p class="histhint" style="margin:0 0 10px">No graded games yet in: '+missing.join(', ').toUpperCase()+' \u2014 tallies appear the day after those sports play.</p>';
  }
  if(flat.length){
    /* Carl 2026-09-02: highest win% at the top (ties broken by bigger sample); empty rows sink */
    flat.sort(function(a,b){
      var na=a.w+a.l, nb=b.w+b.l;
      var pa=na?a.w/na:-1, pb=nb?b.w/nb:-1;
      return (pb-pa)||(nb-na);
    });
    h+='<div class="tscroll"><table><thead><tr><th>Angle</th><th class="num">Record</th><th class="num">Win% ▼</th><th class="num">Sample</th></tr></thead><tbody>'
      +flat.map(function(t){
        var n=t.w+t.l; if(!n)return '';
        var pct=t.w/n*100;
        var cls=n>=20?(pct>=55?'pos':pct<=45?'neg':''):'';
        return '<tr><td>'+(t.sport?'<span class="sporttag">'+esc(String(t.sport).toUpperCase())+'</span>':'')+esc(String(t.angle).replace(/_/g,' '))+'</td>'
          +'<td class="num">'+t.w+'\u2013'+t.l+'</td>'
          +'<td class="num '+cls+'">'+pct.toFixed(0)+'%</td>'
          +'<td class="num">'+(n>=20?'<b>qualified</b>':'n='+n+' \u00b7 tracking')+'</td></tr>';
      }).join('')+'</tbody></table></div>';
  }
  var entries=(journalData&&Array.isArray(journalData.entries))?journalData.entries:[];
  var last=entries.length?entries[entries.length-1]:null;
  if(last){
    h+='<p class="cardnote" style="margin-top:14px"><b>Daily read \u2014 '+esc(last.date||'')+':</b> '+esc(last.read||'')+'</p>';
    if(last.trendNotes)h+='<p class="cardnote"><b>Trend notes:</b> '+esc(String(last.trendNotes))+'</p>';
    var recs=last.recommendations;
    if(typeof recs==='string')recs=[recs];
    if(Array.isArray(recs)&&recs.length)h+='<p class="cardnote"><b>Recommendations (awaiting your approval):</b> '+recs.map(function(r){return esc(String(r))}).join(' \u00b7 ')+'</p>';
  }
  return h||'<p class="none-msg">The shadow ledger fills in after the first graded day \u2014 every tracked game, graded against angles we may or may not be betting.</p>';
}

/* ---------- PLAYS LEDGER ----------
   Carl 2026-09-02: "if you show it to me, it needs to be counted." The code pipeline stamps playsShownAt on a pick
   the moment it qualifies for Today's Plays; from then on it is counted, bet or not, faded or not. Clean start Sep 2. */
function ledgerPicks(){
  var out=[];
  if(!picksData||!picksData.cards)return out;
  picksData.cards.forEach(function(cd){ if(!Array.isArray(cd.picks))return; cd.picks.forEach(function(p){ if(p.playsShownAt){p._cardId=p._cardId||cd.id;out.push(p)} }); });
  return out;
}
/* DO NOT BET (Carl 2026-09-04): a play whose crowd has FLIPPED to our side is not a bet. While live it wears a red
   emblem; the emblem comes off if the signal returns. The read at kickoff decides: flipped at kickoff → the pipeline
   stamps noBet and the play is left out of every record count (it still shows, with its result, marked not counted). */
function isNoBetLive(p){ return !!(p.liveCheck&&!p.liveCheck.ok&&p.liveCheck.why==='flipped'&&(!p.result||p.result==='pending')); }
function ledgerCounted(){ return ledgerPicks().filter(function(p){return !p.noBet}); }
function contChip(p){
  var src=p.contention||String(p.signal||'');
  var m=String(src).match(/CONTENTION:\s*(.*?)\s+out of the playoff race/i); if(!m)return '';
  var teams=m[1].replace(/\s*\([^)]*\)/g,'').split(/\s*&\s*/).join(' & ');
  return '<span class="cchip contention" title="'+esc(String(p.contention||m[0]))+'">⚾ out of race: '+esc(teams)+'</span>';
}
function ledgerHTML2(){
  var L=ledgerPicks();
  if(!L.length)return '<section class="panel"><h2>Plays ledger <small>every pick that appeared under Today’s Plays · counted the moment it was shown</small></h2><p class="none-msg">Starts clean Sep 2 — the first pick to appear on Today’s Plays will show here.</p></section>';
  L.sort(function(a,b){var da=gameDate(a),db=gameDate(b);return (db?db.getTime():0)-(da?da.getTime():0)});
  var w=0,l=0,pu=0,pend=0,nb=0; L.forEach(function(p){if(p.noBet){nb++;return;} if(p.result==='win')w++;else if(p.result==='loss')l++;else if(p.result==='push')pu++;else pend++});
  var rows=L.map(function(p){
    var r=p.result&&p.result!=='pending'?p.result:'pending';
    var st=startOf(p), when=gameISO(p)||'';
    var tm=st?ptTime(new Date(st).getTime())+' PT':'';
    var flags=[];
    if(p.liveCheck&&!p.liveCheck.ok&&p.liveCheck.why==='faded')flags.push('faded before start');
    if(p.liveCheck&&!p.liveCheck.ok&&p.liveCheck.why==='flipped')flags.push('public flipped');
    if(p.noBet)flags.push('DO NOT BET at kickoff · not counted');
    if(p.status==='dead')flags.push('retired');
    if(p.flag98)flags.push('* 98/2');
    return '<div class="ledrow '+esc(r)+'"><span class="ldate">'+esc(when)+(tm?' · '+esc(tm):'')+'</span>'
      +'<span class="lpick"><b>'+esc(p.pick)+'</b> <span class="faint">'+esc(String(p.game||'').replace(/\s*—.*$/,''))+'</span>'+(flags.length?' <span class="lflag">'+esc(flags.join(' · '))+'</span>':'')+'</span>'
      +'<span class="lres '+esc(r)+'">'+(r==='win'?'W':r==='loss'?'L':r==='push'?'P':'·')+'</span></div>';
  }).join('');
  return '<section class="panel"><h2>Plays ledger <small>every pick that appeared under Today’s Plays since Sep 2 · counted the moment it was shown, bet or not</small></h2>'
    +'<p class="sysrec"><b>'+w+'–'+l+(pu?'–'+pu:'')+'</b> '+(w+l?'('+netUnits(w,l)+' at −110)':'')+(pend?' · '+pend+' pending':'')+(nb?' · '+nb+' DO NOT BET at kickoff, not counted':'')+'</p><div class="ledger">'+rows+'</div></section>';
}

/* ---------- per-tab records (Carl 2026-09-02: "the record tab should include the different tabs' win and loss streaks") ----------
   One row per pill on the card. Same bucketing the pills use; graded picks only, pushes shown but kept out of the streak. */
function tabRecordsHTML(){
  if(!picksData||!picksData.cards)return '';
  var PAPER={'patrick-variables':1,'rnd-fade':1,'ufc-card':1};
  var ANGLE={'wcoast-angle':1,'roaddog-angle':1,'homedog-angle':1,'auto-alerts':1};
  function sportTag(p){var m=String(p.game||'').match(/\((NFL|WNBA|NBA|CFB|CBB|MLB|NHL)\)/i);return m?m[1].toUpperCase():''}
  var TABS=[
    ['Plays (ledger)',function(p,id){return !!p.playsShownAt&&!p.noBet}],
    ['Patrick’s Variables',function(p,id){return id==='patrick-variables'&&p.kind!=='injury'&&p.kind!=='ps'&&p.kind!=='yoyo'}],
    ['Phil Steele (PS)',function(p,id){return id==='patrick-variables'&&p.kind==='ps'}],
    ['R&amp;D',function(p,id){return id==='rnd-fade'}],
    ['NHL',function(p,id){return !PAPER[id]&&sportTag(p)==='NHL'}],
    ['Fade system',function(p,id){return !PAPER[id]&&!ANGLE[id]&&(!p.kind||p.kind==='fade')}],
    ['Road dogs 1H',function(p,id){return id==='roaddog-angle'}],
    ['Home dogs 1H',function(p,id){return id==='homedog-angle'}]
  ];
  /* chronological: by game date, then the order they sit in the doc */
  var all=[];var order=0;
  picksData.cards.forEach(function(cd){if(!Array.isArray(cd.picks))return;cd.picks.forEach(function(p){
    if(p.status==='dead'||p.kind==='injury')return;
    var r=p.result; if(r!=='win'&&r!=='loss'&&r!=='push')return;
    var d=gameDate(p); all.push({p:p,id:cd.id,t:d?d.getTime():0,o:order++});
  })});
  all.sort(function(a,b){return (a.t-b.t)||(a.o-b.o)});
  var rows=TABS.map(function(tab){
    var seq=[],w=0,l=0,pu=0;
    all.forEach(function(x){ if(!tab[1](x.p,x.id))return; var r=x.p.result; if(r==='push'){pu++;return} seq.push(r); if(r==='win')w++; else l++; });
    if(!seq.length&&!pu)return '<div class="tabrec"><span class="tname">'+tab[0]+'</span><span class="trec faint">no graded picks yet</span></div>';
    var cur=0,last=seq[seq.length-1]; for(var i=seq.length-1;i>=0&&seq[i]===last;i--)cur++;
    var bestW=0,run=0; seq.forEach(function(r){run=r==='win'?run+1:0; if(run>bestW)bestW=run});
    var worstL=0; run=0; seq.forEach(function(r){run=r==='loss'?run+1:0; if(run>worstL)worstL=run});
    var pct=seq.length?((w/seq.length)*100).toFixed(0)+'%':'—';
    var dots=seq.slice(-10).map(function(r){return '<span class="dot '+(r==='win'?'dw':'dl')+'">'+(r==='win'?'W':'L')+'</span>'}).join('');
    return '<div class="tabrec">'
      +'<span class="tname">'+tab[0]+'</span>'
      +'<span class="trec"><b>'+w+'–'+l+(pu?'–'+pu:'')+'</b> <span class="faint">'+pct+' · </span><span class="'+netUnitsCls(w,l)+'">'+netUnits(w,l)+'</span></span>'
      +'<span class="tstreak '+(seq.length?(last==='win'?'pos':'neg'):'')+'" title="current streak · best run of wins / worst run of losses">'+(seq.length?(cur+(last==='win'?'W':'L')):'—')+'<small> · best W'+bestW+' · worst L'+worstL+'</small></span>'
      +'<span class="tdots">'+dots+'</span>'
      +'</div>';
  }).join('');
  return '<section class="panel"><h2>Record by tab <small>same buckets as the pills on the card · graded picks only · streak excludes pushes · dots = last 10</small></h2><div class="tabrecs">'+rows+'</div></section>';
}

/* ---------- daily record strip (slate cards = what Carl actually bets) ---------- */
function dayRecHTML(){
  if(!picksData||!picksData.cards)return '';
  var today=ptISO(), week=[]; /* the slate is dated in Pacific time, whatever the phone's zone */
  for(var i=0;i<7;i++){week.push(ptISO(Date.now()-i*86400000))}
  var t={w:0,l:0,p:0}, wk={w:0,l:0,p:0};
  picksData.cards.forEach(function(cd){
    var m=String(cd.id||'').match(/^(?:slate|code)-(\d{4}-\d{2}-\d{2})$/);
    if(!m||!Array.isArray(cd.picks))return; /* a card without a picks array must never blank the app */
    cd.picks.forEach(function(pk){
      if(!pk.result||pk.result==='pending')return;
      var k=pk.result==='win'?'w':pk.result==='loss'?'l':'p';
      if(m[1]===today)t[k]++;
      if(week.indexOf(m[1])>=0)wk[k]++;
    });
  });
  if(!(t.w+t.l+t.p)&&!(wk.w+wk.l+wk.p))return '';
  function seg(lbl,r){
    if(!(r.w+r.l+r.p))return '';
    var u=r.w*0.909-r.l, uc=u>0?'pos':u<0?'neg':'';
    return '<span>'+lbl+' <b class="'+(r.w>r.l?'pos':r.l>r.w?'neg':'')+'">'+r.w+'–'+r.l+(r.p?'–'+r.p:'')+'</b> <span class="'+uc+'">('+(u>0?'+':u<0?'−':'')+Math.abs(u).toFixed(1)+'u)</span></span>';
  }
  return '<div class="dayrec">'+seg('Slate today',t)+seg('Last 7 days',wk)+'</div>';
}

/* ---------- second-source confirmation (code, not AI) ----------
   Rule (Carl, 2026-09-02): VSiN/DK decides the play. Action Network only grades confidence:
   ✓ confirmed = Action's majority-ticket side agrees with VSiN's public side
   ⚠ caution   = Action's public is on the OTHER side (play stands, less confirmation)
   ◌ unconfirmed = no Action row loaded for this game/market yet */
function lastWordKey(s){var w=String(s||'').trim().split(/\s+/);return w[w.length-1].toLowerCase().replace(/[^a-z]/g,'')}
function teamKey(s){return lastWordKey(String(s||'').replace(/\b(ML|1H|F5)\b/gi,'').replace(/[+-]?\d[\d.]*\s*$/,'').trim())}
function isoDateOf(p){var d=gameDate(p);if(!d)return null;return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function publicSideOf(p){
  var s=String(p.signal||'');
  var m=s.match(/PUBLIC\s+\d+%\s+(?:of\s+)?tickets on\s+(.+?)\s+(?:but|—|-|·)/i)||s.match(/public on\s+(.+?)\s+[—-]/i)||s.match(/\d+%\s+(?:of\s+)?tickets on\s+(.+?)\s+(?:but|—|-|·)/i);
  return m?m[1].trim():null;
}
/* which of a game's two teams does a label name? 'away'|'home'|null. null when it can't be told apart —
   including games where BOTH teams share a nickname (Red Sox @ White Sox, Tigers vs Tigers) — so a shared
   nickname can never turn into a false ✓ */
function whichTeam(label,away,home){
  var la=lastWordKey(away),lh=lastWordKey(home); if(!la||!lh||la===lh)return null;
  var t=String(label||'').replace(/\b(ML|1H|F5)\b/gi,'').replace(/[+-]?\d[\d.]*\s*$/,'').trim();
  var ab=t.match(/^([A-Z]{2,4})$/); /* abbreviation only ("GB"): match the ABBR that leads the team in the game string */
  if(ab){ if(String(away).indexOf(ab[1]+' ')===0)return 'away'; if(String(home).indexOf(ab[1]+' ')===0)return 'home'; return null }
  var k=lastWordKey(t); if(k&&k===la)return 'away'; if(k&&k===lh)return 'home';
  var n=t.toLowerCase().replace(/[^a-z]/g,'');
  if(n.length>=5){ if(String(away).toLowerCase().replace(/[^a-z]/g,'').indexOf(n)>=0)return 'away'; if(String(home).toLowerCase().replace(/[^a-z]/g,'').indexOf(n)>=0)return 'home' }
  return null;
}
function confirmChip(p){
  if(!extData||!extData.rows)return '';
  if(p.kind&&p.kind!=='fade')return '';
  if(p.result&&p.result!=='pending')return '';
  var unk='<span class="cchip unconfirmed" title="No second-source data loaded for this game yet">◌ unconfirmed</span>';
  var pub=publicSideOf(p); if(!pub)return unk;
  var mk=/total/i.test(p.type||'')?'Total':/money/i.test(p.type||'')?'ML':/spread/i.test(p.type||'')?'Spread':null; if(!mk)return unk;
  var gm=String(p.game||'').match(/^(.*?)\s+@\s+(.*?)\s+[—-]/); if(!gm)return unk;
  var away=gm[1],home=gm[2],date=isoDateOf(p),sport=p._sport;
  var rows=extData.rows,k,matches=[];
  /* match the PAIR of nicknames regardless of order — a source (or an old AI routine) may list home/away swapped */
  var want=[lastWordKey(away),lastWordKey(home)].sort().join('~');
  for(k in rows){var r=rows[k];
    if(r.league===sport&&r.market===mk&&r.date===date&&[lastWordKey(r.away),lastWordKey(r.home)].sort().join('~')===want)matches.push(r)}
  if(matches.length!==1)return unk; /* nothing loaded, or a doubleheader we can't tell apart */
  var row=matches[0]; if(!row.a||!row.b||row.a.bets==null||row.b.bets==null)return unk;
  var src=row.source==='actionnetwork'?'Action':row.source;
  if(Math.abs(row.a.bets-row.b.bets)<6)return '<span class="cchip unconfirmed" title="'+esc(src)+' is split '+row.a.bets+'/'+row.b.bets+' on this market — no read either way">◌ '+esc(src)+' split</span>';
  var side=row.a.bets>row.b.bets?row.a:row.b, name=String(side.name||'');
  var agrees;
  if(mk==='Total'){
    var ours=/^over/i.test(pub)?'over':/^under/i.test(pub)?'under':null, theirs=/^over/i.test(name)?'over':/^under/i.test(name)?'under':null;
    if(!ours||!theirs)return unk;
    agrees=(ours===theirs);
  }else{
    var theirSlot=whichTeam(name,row.away,row.home), ourSlot=whichTeam(pub,away,home);
    if(!theirSlot||!ourSlot)return unk;
    /* the row may list home/away swapped relative to our game string — compare the TEAM, not the slot */
    agrees=(lastWordKey(theirSlot==='away'?row.away:row.home)===lastWordKey(ourSlot==='away'?away:home));
  }
  var money=side.money!=null?(' · '+side.money+'% $'):'';
  return agrees
    ? '<span class="cchip confirmed" title="'+esc(src)+' agrees: public on '+esc(name)+' ('+side.bets+'% of bets'+esc(money)+')">✓ '+esc(src)+' confirms</span>'
    : '<span class="cchip caution" title="'+esc(src)+' shows the public on '+esc(name)+' ('+side.bets+'% of bets'+esc(money)+') — disagrees with VSiN. Play stands, less confirmation.">⚠ caution · '+esc(src)+' disagrees</span>';
}

/* ---------- form wiring ---------- */
function wireForm(){
  var form=document.getElementById("betform"); if(!form)return;
  var type=document.getElementById("f-type"), stake=document.getElementById("f-stake"),
      odds=document.getElementById("f-odds"), chip=document.getElementById("bucketchip"),
      towin=document.getElementById("towin"), warn=document.getElementById("formwarn");
  function refresh(){
    var bk=bucketOf(type.value);
    chip.textContent=bk==="fun"?"Fun bucket":"Core bucket";
    chip.className="bucket-chip "+(bk==="fun"?"bucket-fun":"bucket-core");
    var st=parseFloat(stake.value)||0, od=parseInt(odds.value,10)||0;
    towin.textContent=(st>0&&Math.abs(od)>=100)?("to win "+money(od>0?st*od/100:st*100/Math.abs(od))):"";
    var msgs=[], s=computeStats(), u=state.config.unit;
    if(st>2*u)msgs.push("That’s "+(st/u).toFixed(1)+"u — house rule caps you at 2u ("+money(2*u)+").");
    else if(st>u&&bk==="core")msgs.push("Over 1u — fine occasionally, but flat is the plan.");
    if(bk==="fun"&&st>u/2)msgs.push("Parlays are half-unit ("+money(u/2)+") territory.");
    if(bk==="fun"&&s.funRemaining<=0)msgs.push("Fun bucket is empty. Gone is gone — rule 04.");
    warn.style.display=msgs.length?"block":"none";
    warn.textContent=msgs.join(" ");
  }
  type.addEventListener("change",refresh);
  stake.addEventListener("input",refresh);
  odds.addEventListener("input",refresh);
  form.querySelectorAll(".ub").forEach(function(btn){
    btn.addEventListener("click",function(){stake.value=(state.config.unit*parseFloat(btn.dataset.u)).toFixed(2).replace(/\.00$/,"");refresh()});
  });
  refresh();
  form.addEventListener("submit",function(e){
    e.preventDefault();
    var od=parseInt(odds.value,10);
    if(!od||Math.abs(od)<100){warn.style.display="block";warn.textContent="American odds are ≤ −100 or ≥ +100 (e.g. −110, +150).";return}
    var st=parseFloat(stake.value);
    if(!(st>0))return;
    state.bets.push({
      id:"b"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36),
      date:document.getElementById("f-date").value||todayStr(),
      desc:document.getElementById("f-desc").value.trim(),
      type:type.value, odds:od, stake:st,
      book:(document.getElementById("f-book").value.trim()||"—"),
      result:"pending", createdAt:Date.now()
    });
    save();
  });
}

    var fd=document.getElementById("f-desc");
    if(fd){
      fd.value=pk+" ("+(gm.split("—")[0]||gm).trim()+")";
      var ft=document.getElementById("f-type");
      ft.value=pt||"Spread";
      ft.dispatchEvent(new Event("change"));
      document.getElementById("betform").scrollIntoView({behavior:"smooth",block:"center"});
    }
    return;
  }
  var id=el.dataset.id;
  if(el.dataset.action==="settle"){
    var b=state.bets.find(function(x){return x.id===id}); if(!b)return;
    b.result=el.dataset.r; pendingDelete=null; save();
  }else if(el.dataset.action==="del"){
    if(pendingDelete===id){
      state.bets=state.bets.filter(function(x){return x.id!==id});
      pendingDelete=null; save();
    }else{ pendingDelete=id; render(); }
  }
});

/* ---------- persistence ---------- */
function setNote(txt,warn){
  var n=document.getElementById("savenote");
  if(n){n.textContent=txt;n.classList.toggle("warn",!!warn)}
}
function save(){
  state.rev=(state.rev||0)+1;
  var json=JSON.stringify(state);
  try{localStorage.setItem(LSKEY,json)}catch(_){}
  render();
  var k=appKey();
  if(!k){setNote("no sync key — saving to this device only",true);return}
  setNote("saving…");
  fetch(API,{method:"PUT",headers:{"content-type":"application/json","x-app-key":k},body:json})
    .then(function(r){
      if(r.ok){syncOK=true;saveMode="synced — every device sees this";setNote(saveMode)}
      else if(r.status===401){syncOK=false;setNote("wrong sync key — saving to this device only",true)}
      else{syncOK=false;setNote("sync failed — kept on this device",true)}
    })
    .catch(function(){syncOK=false;setNote("offline — kept on this device",true)});
}
function pullRemote(){
  var k=appKey(); if(!k)return Promise.resolve(null);
  return fetch(API,{headers:{"x-app-key":k},cache:"no-store"})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
    .catch(function(){return null});
}
/* Cheap freshness probe first (?meta=1 returns just {rev}); the body is downloaded only when the
   revision actually changed. Cuts the dashboard's traffic from ~390 MB/day to a few MB. */
function pullDoc(url,getCur,setCur,onBody){
  var k=appKey(); if(!k)return Promise.resolve();
  var sep=url.indexOf('?')>=0?'&':'?';
  var cur=getCur();
  return fetch(url+sep+"meta=1",{headers:{"x-app-key":k},cache:"no-store"})
    .then(function(r){return r.ok?r.json():null})
    .then(function(m){
      if(m&&cur&&(m.rev||0)===(cur.rev||0)){ if(onBody)onBody(null,true); return null; }
      return fetch(url,{headers:{"x-app-key":k},cache:"no-store"}).then(function(r){return r.ok?r.json():null});
    })
    .then(function(d){
      if(!d)return;
      if(onBody)onBody(d,false);
      if(!cur||(d.rev||0)!==(cur.rev||0)){setCur(d);render();}
    })
    .catch(function(){});
}
function pullPicks(){return pullDoc(API+"?doc=picks",function(){return picksData},function(d){picksData=d},function(d,same){if(d||same)lastDataAt=Date.now()})}
function pullLines(){return pullDoc(API+"?doc=lines",function(){return linesData},function(d){linesData=d})}
function pullJournal(){return pullDoc(API+"?doc=journal",function(){return journalData},function(d){journalData=d})}
function pullSentiment(){return pullDoc(API+"?doc=sentiment",function(){return sentimentData},function(d){sentimentData=d})}
function pullExternal(){return pullDoc("/api/ingest",function(){return extData},function(d){extData=d})}
var lineTick=0;
function refreshFromRemote(){
  pullPicks();
  if(++lineTick%5===1){pullJournal();pullSentiment();pullExternal(); if(cardSub==='lines')pullLines();} /* bigger docs — every 5 min; the line tracker only when its (hidden) tab is open */
  if(!BET_TRACKING)return; /* bankroll doc is shelved — don't poll it */
  pullRemote().then(function(remote){
    if(remote&&(remote.rev||0)>(state.rev||0)){
      state=remote;
      try{localStorage.setItem(LSKEY,JSON.stringify(state))}catch(_){}
      render();
      setNote("synced — every device sees this");
    }
  });
}

/* ---------- boot ---------- */
(function boot(){
  try{
    var ls=localStorage.getItem(LSKEY);
    if(ls){var parsed=JSON.parse(ls); if((parsed.rev||0)>=(state.rev||0))state=parsed;}
  }catch(_){}
  var k=appKey();
  saveMode=k?"connecting…":"no sync key — this device only";
  syncOK=false;
  render();
  if(!k)return;
  pullRemote().then(function(remote){
    if(remote===null){setNote("can’t reach sync — this device only",true);return}
    syncOK=true;
    if((remote&&(remote.rev||0))>(state.rev||0)){
      state=remote;
      try{localStorage.setItem(LSKEY,JSON.stringify(state))}catch(_){}
    }else if((state.rev||0)>((remote&&remote.rev)||0)){
      // local is ahead (e.g. edits made while offline) — push it up
      fetch(API,{method:"PUT",headers:{"content-type":"application/json","x-app-key":k},body:JSON.stringify(state)});
    }
    saveMode="synced — every device sees this";
    render();
  });
  pullPicks(); pullLines(); pullJournal(); pullSentiment(); pullExternal();
  setInterval(refreshFromRemote,60000);
  setInterval(function(){var u=document.getElementById("updated");if(u)u.textContent=updatedTxt()},30000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)refreshFromRemote()});
})();
})();
</script>
